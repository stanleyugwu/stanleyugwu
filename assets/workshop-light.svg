<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Devvie’s workshop — curiosity, with a commit history</title>
  <desc id="desc">An editorial cover with curling blue linework, handwritten-style annotations, and three overlapping circles for product, business and system.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#11110F" opacity=".075"/></pattern>
    <clipPath id="cover"><rect width="1280" height="420" rx="20"/></clipPath>
  </defs>
