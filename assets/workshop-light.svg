    <text x="1224" y="56" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#66645F">STANLEY UGWU / LAGOS</text>
    <text x="54" y="183" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" letter-spacing="-4.5" fill="#11110F">Curiosity, with</text>
    <text x="54" y="270" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="700" letter-spacing="-4.5" fill="#11110F">a commit history.</text>
