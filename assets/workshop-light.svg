    <circle cx="807" cy="213" r="4.5" fill="#315BFF"/>
    <path d="M1103 131C1168 114 1201 148 1185 198C1175 230 1155 240 1170 255C1184 269 1205 249 1190 236C1171 222 1145 250 1153 290" stroke="#315BFF" stroke-width="1.5" stroke-linecap="round"/>
