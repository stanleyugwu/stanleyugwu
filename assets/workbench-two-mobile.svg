ke="none" stroke-width="1"/><text x="28" y="38" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#171A2B" letter-spacing="2">04 / MOBILE PAYMENTS</text><text x="28" y="91" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#171A2B" letter-spacing="-2">Wattly</text><text x="30" y="121" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#171A2B" >“Pending” is part of the product.</text><path d="M28 144H568" fill="none" stroke="#171A2B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".18"/><g transform="translate(43 175) rotate(-4 90 105)"><rect x="0" y="0" width="188" height="213" rx="10" fill="#FCFBF8" stroke="#171A2B" stroke-width="1.6"/><path d="M0 185H188" fill="none" stroke="#171A2B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="22" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" letter-spacing="1">TRANSACTION</text><rect x="22" y="53" width="142" height="6" rx="3" fill="#DCD9D1" stroke="none" stroke-width="1"/><rect x="22" y="70" width="97" height="6" rx="3" fill="#EAE7E0" stroke="none" stroke-width="1"/><rect x="22" y="97" width="139" height="28" rx="14" fill="#F6E3B2" stroke="#171A2B" stroke-width="1"/><text x="91.5" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" text-anchor="middle">PENDING</text><text x="22" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#171A2B" >still on it.</text><text x="22" y="202" font-family="monospace" font-size="12" font-weight="500" fill="#171A2B" >WATTLY / MOBILE</text></g><rect x="291" y="187" width="237" height="28" rx="14" fill="#FCFBF8" stroke="#171A2B" stroke-width="1"/><text x="409.5" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" text-anchor="middle">check transaction status</text><path d="M410 215V246" fill="none" stroke="#315BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M404 236L410 247L416 236" fill="none" stroke="#315BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="291" y="252" width="237" height="70" rx="12" fill="#171A2B" stroke="none" stroke-width="1"/><text x="410" y="280" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#FCFBF8" text-anchor="middle">surface the token</text><text x="410" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#F6E3B2" text-anchor="middle">when it’s available</text><text x="283" y="369" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#315BFF" transform="rotate(-4 283 369)">unfinished ≠ forgotten.</text><g transform="translate(546 102) scale(0.68)"><path d="M0-23L6-9L20-15L13-1L26 8L10 10L12 26L0 15L-12 24L-10 8L-26 5L-12-3L-20-18L-4-11Z" fill="#DCD5F5" stroke="#171A2B" stroke-width="1.6" stroke-linejoin="round"/></g></g></svg>
