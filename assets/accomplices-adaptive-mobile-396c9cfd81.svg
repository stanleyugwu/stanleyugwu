<rect width="624" height="1090" rx="18" fill="var(--bg)"/>
<rect width="624" height="1090" rx="18" fill="url(#dots)"/>
<text x="30" y="40" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="22" font-weight="400" fill="var(--muted)">USUALLY WITHIN ARM’S REACH</text>
