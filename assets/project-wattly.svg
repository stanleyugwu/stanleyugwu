<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="280" viewBox="0 0 1240 280" role="img" aria-labelledby="title"><title id="title">Wattly — “Pending” is part of the product.</title><rect x="0" y="0" width="1240" height="280" rx="18" fill="#F6E3B2" stroke="none" stroke-width="1"/><text x="32" y="41" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#171A2B" letter-spacing="2">04 / MOBILE PAYMENTS</text><text x="32" y="112" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#171A2B" letter-spacing="-2">Wattly</text><text x="34" y="158" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#171A2B" >“Pending” is part of the product.</text><path d="M582 32V248" fill="none" stroke="#171A2B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".16"/><g transform="translate(660 -88) scale(.85)"><g transform="translate(43 175) rotate(-4 90 105)"><rect x="0" y="0" width="188" height="213" rx="10" fill="#FCFBF8" stroke="#171A2B" stroke-width="1.6"/><path d="M0 185H188" fill="none" stroke="#171A2B" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="22" y="35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" letter-spacing="1">TRANSACTION</text><rect x="22" y="53" width="142" height="6" rx="3" fill="#DCD9D1" stroke="none" stroke-width="1"/><rect x="22" y="70" width="97" height="6" rx="3" fill="#EAE7E0" stroke="none" stroke-width="1"/><rect x="22" y="97" width="139" height="28" rx="14" fill="#F6E3B2" stroke="#171A2B" stroke-width="1"/><text x="91.5" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" text-anchor="middle">PENDING</text><text x="22" y="151" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#171A2B" >still on it.</text><text x="22" y="202" font-family="monospace" font-size="12" font-weight="500" fill="#171A2B" >WATTLY / MOBILE</text></g><rect x="291" y="187" width="237" height="28" rx="14" fill="#FCFBF8" stroke="#171A2B" stroke-width="1"/><text x="409.5" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#171A2B" text-anchor="middle">check transaction status</text><path d="M410 215V246" fill="none" stroke="#315BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M404 236L410 247L416 236" fill="none" stroke="#315BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="291" y="252" width="237" height="70" rx="12" fill="#171A2B" stroke="none" stroke-width="1"/><text x="410" y="280" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#FCFBF8" text-anchor="middle">surface the token</text><text x="410" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#F6E3B2" text-anchor="middle">when it’s available</text><text x="283" y="369" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#315BFF" transform="rotate(-4 283 369)">unfinished ≠ forgotten.</text></g></svg>
