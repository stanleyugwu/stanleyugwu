<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" role="img" aria-labelledby="title desc">
<title id="title">The usual accomplices</title>
<desc id="desc">The usual accomplices: React Native, Expo, Reanimated and FlashList for mobile; Node.js, Express, PostgreSQL, Prisma, Redis, BullMQ, REST and WebSockets for backend systems; TypeScript, JavaScript and React.js across the work; Jest and Mocha for testing; Docker, Kamal, GitHub Actions, Xcode and Android Studio for delivery. C is a current learning detour.</desc>
<style>:root{--ink:#171A2B;--muted:#626674;--blue:#315BDF;--bg:#F7F6F2;--rule:#D6D6D6;--lavender:#E5DFF5;--mint:#DFEDE2;--gold:#F4E6BF}@media(prefers-color-scheme:dark){:root{--ink:#F3F1EB;--muted:#B5B8C5;--blue:#97B5FF;--bg:#151A25;--rule:#3B4355;--lavender:#38364E;--mint:#233D3B;--gold:#49402C}}</style>
